name: Train Multilingual BERT

on:
  workflow_dispatch: # Allows triggering via curl/API

jobs:
  train-job:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets scikit-learn accelerate

      - name: Run training script
        run: |
          python train.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: my_multilabel_model
          path: my_multilabel_model.zip
          retention-days: 3

